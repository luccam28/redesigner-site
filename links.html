    <style>
        :root {
            --brand-yellow: #FFC700;
            --brand-purple: #59178A;
            --brand-dark: #363630;
            --bg-darker: #20201d;
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.75);
            --glass: rgba(54, 54, 48, 0.5);
            --transition: 0.4s cubic-bezier(0.22, 0.97, 0.36, 1);
            --card-radius: 22px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-darker);
            color: var(--text-main);
            font-family: 'Paralucent Text', 'Paralucent', 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 50px 20px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Fundo de grade sutil (igual ao index) */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 25% 40%, rgba(89, 23, 138, 0.15) 1.5px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none; z-index: 0;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Badge giratório decorativo */
        .propulsao-badge {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            animation: spinBadge 28s linear infinite;
            opacity: 0.25;
        }
        .propulsao-badge.top-right {
            top: -120px;
            right: -120px;
            width: 280px;
            height: 280px;
        }
        .propulsao-badge.bottom-left {
            bottom: -120px;
            left: -120px;
            width: 240px;
            height: 240px;
            animation-direction: reverse;
        }
        @keyframes spinBadge {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Container principal */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        /* Logo com efeito */
        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }
        .logo-img {
            width: 90px;
            height: auto;
            filter: brightness(0) invert(1);
            transition: transform 0.5s ease;
            position: relative;
            z-index: 1;
        }
        .logo-wrapper:hover .logo-img {
            transform: scale(1.08);
        }
        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(89, 23, 138, 0.35) 0%, transparent 70%);
            z-index: 0;
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); }
        }

        /* Título */
        .brand-name {
            font-weight: 900;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #fff, var(--brand-yellow));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .tagline {
            font-family: 'Gochi Hand', cursive;
            font-size: 1.1rem;
            color: var(--brand-yellow);
            margin-bottom: 35px;
            opacity: 0.9;
        }

        /* Links */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 45px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: var(--card-radius);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.4s cubic-bezier(0.22, 0.97, 0.36, 1);
            position: relative;
            overflow: hidden;
            background: rgba(54, 54, 48, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(89, 23, 138, 0.3);
            color: #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,199,0,0.05), transparent);
            transition: left 0.7s;
        }

        .link-card:hover {
            transform: translateY(-4px);
            border-color: var(--brand-purple);
            background: rgba(89, 23, 138, 0.25);
            box-shadow: 0 15px 35px rgba(89, 23, 138, 0.35);
            color: #fff;
        }
        .link-card:hover::before {
            left: 100%;
        }

        /* Card principal (CTA) */
        .link-card.featured {
            background: var(--brand-yellow);
            color: var(--brand-dark);
            border: none;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255, 199, 0, 0.35);
            animation: subtlePulse 2.5s ease-in-out infinite;
        }
        @keyframes subtlePulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 199, 0, 0.35); }
            50% { box-shadow: 0 15px 45px rgba(255, 199, 0, 0.55); }
        }
        .link-card.featured:hover {
            background: #ffffff;
            color: var(--brand-dark);
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(255, 199, 0, 0.5);
            animation: none;
        }

        /* Ícones dentro dos cards */
        .link-card i,
        .link-card .emoji-icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .link-card.featured i {
            color: var(--brand-purple);
        }

        /* Social proof rápido */
        .social-proof {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .social-proof a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim);
            font-size: 1.2rem;
            text-decoration: none;
            transition: var(--transition);
        }
        .social-proof a:hover {
            background: var(--brand-purple);
            color: #fff;
            border-color: var(--brand-purple);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(89,23,138,0.4);
        }

        /* Footer */
        .footer-note {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            opacity: 0.5;
            margin-top: 10px;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
                padding: 0 5px;
            }
            .link-card {
                padding: 16px 18px;
                font-size: 0.8rem;
                letter-spacing: 1px;
            }
            .link-card.featured {

            }
            .brand-name {

            }
            .logo-img {

            .propulsao-badge.top-right {

            }

                bottom: -150px;
                left: -150px;
                width: 180px;
                height: 180px;
                opacity: 0.15;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer></script>
    <script>
        (function() {
            // Partículas
            if(window.particlesJS) {
                particlesJS("particles-js", {
                    particles: {
                        number: { value: 50 },
                        color: { value: "#ffffff" },
                        opacity: { value: 0.18 },
                        size: { value: 2 },
                        line_linked: { 
                            enable: true, 
                            distance: 150, 
                            color: "#ffffff", 
                            opacity: 0.06, 
                            width: 1 
                        },
                        move: { 
                            enable: true, 
                            speed: 0.6 
                        }
                    }
                });
            }

            // Efeito de entrada suave nos cards
            const cards = document.querySelectorAll('.link-card');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if(entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.1 });

            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = `opacity 0.6s ${index * 0.1}s, transform 0.6s ${index * 0.1}s`;
                observer.observe(card);
            });

            // Forçar a animação inicial
            setTimeout(() => {
                cards.forEach(card => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                });
            }, 200);
        })();
    </script>
